<!doctype html>

<head data-page-node-id="FFccBXLPokJesAVziySMfy">
  <meta charset="utf-8" data-page-node-id="K7KxT6qFNcK4irFdRQCmNB">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" data-page-node-id="ErU2FDdA6F8GBSSS9DA5jY">
  <title>AI伴随方案探索html</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0d0f12;
      --panel: rgba(25, 28, 34, .78);
      --line: rgba(255,255,255,.12);
      --text: #f7f8fa;
      --muted: #aeb4bf;
      --accent: #ff2d6f;
      --cyan: #70f2ef;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      overflow-y: auto;
      scrollbar-gutter: stable;
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 24% 12%, rgba(112,242,239,.09), transparent 30%),
        radial-gradient(circle at 84% 86%, rgba(255,45,111,.08), transparent 32%),
        var(--bg);
      user-select: none;
      -webkit-user-select: none;
    }

    button { font: inherit; }

    .app {
      width: min(1180px, 100%);
      min-height: 100vh;
      height: auto;
      margin: 0 auto;
      padding: 18px 28px 48px;
      display: grid;
      grid-template-rows: auto auto;
      justify-content: center;
      gap: 14px;
    }

    .scheme-switch {
      justify-self: center;
      display: inline-flex;
      gap: 5px;
      padding: 5px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(23, 26, 32, .82);
      backdrop-filter: blur(18px);
      box-shadow: 0 10px 28px rgba(0,0,0,.24), inset 0 1px rgba(255,255,255,.05);
      z-index: 20;
    }

    .scheme-option {
      appearance: none;
      border: 0;
      border-radius: 11px;
      padding: 9px 16px;
      color: #9299a4;
      background: transparent;
      font-size: 13px;
      font-weight: 650;
      cursor: pointer;
      transition: color .2s ease, background .2s ease, box-shadow .2s ease;
    }

    .scheme-option:hover { color: #fff; }

    .scheme-option[aria-pressed="true"] {
      color: #071313;
      background: var(--cyan);
      box-shadow: 0 5px 18px rgba(112,242,239,.2);
    }

    .demo-layout {
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(310px, 540px) minmax(300px, 420px);
      justify-content: center;
      align-items: center;
      gap: clamp(30px, 6vw, 80px);
    }

    .stage {
      min-width: 0;
      height: 100%;
      display: grid;
      place-items: center;
    }

    .phone {
      position: relative;
      height: min(86vh, 870px);
      max-width: 100%;
      aspect-ratio: 1033 / 1640;
      overflow: hidden;
      isolation: isolate;
      filter: drop-shadow(0 24px 46px rgba(0,0,0,.48));
      touch-action: none;
      background: transparent;
    }

    .frame {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      opacity: 0;
      pointer-events: none;
      transition: opacity 280ms cubic-bezier(.22,.8,.26,1), clip-path 260ms cubic-bezier(.22,.8,.26,1);
      will-change: opacity, clip-path;
    }

    .frame-4 {
      clip-path: inset(6.75% 5.7% 13.3% 68.2% round 24px);
    }

    .d-wake-underlay,
    .d-wake-state,
    .d-wake-tools,
    .d-wake-product-layer {
      position: absolute;
      display: none;
      pointer-events: none;
      will-change: transform, opacity, filter;
    }

    .d-wake-underlay {
      z-index: 5;
      left: 4.35%;
      right: 3.78%;
      top: 1.22%;
      bottom: 1.22%;
      border-radius: 9.2% / 5.8%;
      background: #000;
      overflow: hidden;
    }

    .d-wake-state {
      z-index: 6;
      left: 4.35%;
      top: 1.22%;
      width: 91.87%;
      height: 97.56%;
      object-fit: fill;
      transform-origin: 50% 0;
    }

    .d-wake-tools {
      z-index: 7;
      left: 8%;
      bottom: 3.55%;
      width: 84.5%;
      height: auto;
      object-fit: contain;
      transform-origin: 50% 100%;
    }

    .d-wake-product-layer {
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .d-wake-product-main {
      z-index: 6;
      clip-path: inset(1.22% 3.78% 11.7% 4.35% round 8.8%);
      transform-origin: 4.35% 1.22%;
    }

    .d-wake-product-tools {
      z-index: 7;
      clip-path: inset(87.8% 3.78% 1.22% 4.35% round 0 0 8.8% 8.8%);
      transform-origin: 50% 100%;
    }

    .d-motion-mask,
    .d-motion-layer {
      position: absolute;
      z-index: 8;
      display: none;
      pointer-events: none;
      will-change: transform, opacity, filter, clip-path;
    }

    .d-motion-mask {
      z-index: 7;
      overflow: hidden;
      background: #000;
      opacity: 0;
    }

    .d-motion-layer {
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      opacity: 0;
      transform-origin: 50% 50%;
    }

    .phone.tracking .frame { transition: none; }

    #polishedKnowledge { position:absolute; inset:0; width:100%; height:100%; z-index:9; display:none; pointer-events:none; }
    #polishedKnowledge text { font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif; fill:white; }
    #polishedKnowledge .glass { fill:url(#motionGlass); stroke:#c2c2c2; stroke-width:2; }
    #polishedKnowledge .motion-tool { fill:none; stroke:#b9babc; stroke-width:4; stroke-linecap:round; stroke-linejoin:round; }
    #polishedKnowledge .service-icon { fill:none; stroke:white; stroke-width:3; stroke-linecap:round; stroke-linejoin:round; }
    #motionStatus { display:none; }

    .hit {
      position: absolute;
      z-index: 10;
      border: 0;
      background: transparent;
      padding: 0;
      margin: 0;
      color: transparent;
      touch-action: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .nav-hit {
      left: 0;
      right: auto;
      top: 22.4%;
      bottom: auto;
      width: 5.2%;
      height: 10.2%;
      border-radius: 0 14px 14px 0;
      cursor: pointer;
    }

    .orb-hit {
      right: 3.9%;
      bottom: 2.0%;
      width: 17.5%;
      aspect-ratio: 1;
      border-radius: 50%;
      cursor: grab;
      display: none;
    }

    .orb-hit:active { cursor: grabbing; }

    .suggestion-hit {
      right: 7.2%;
      bottom: 12.3%;
      width: 26%;
      height: 5.8%;
      border-radius: 999px;
      display: none;
    }

    .resize-hit {
      left: 64.8%;
      bottom: 11.3%;
      width: 9.6%;
      aspect-ratio: 1;
      cursor: nwse-resize;
      display: none;
    }

    .edge-hit {
      right: 0;
      bottom: 2%;
      width: 12%;
      height: 11%;
      display: none;
      cursor: w-resize;
    }

    .bottom-zone {
      left: 43%;
      right: 17%;
      bottom: 8.5%;
      height: 15%;
      display: none;
      cursor: ew-resize;
    }

    .platform-hit {
      right: 4.5%;
      top: 7%;
      width: 29%;
      height: 80%;
      display: none;
      cursor: pointer;
      border-radius: 24px;
    }

    .product-nav-hit {
      left: 30%;
      right: 30%;
      bottom: .4%;
      height: 6%;
      display: none;
      cursor: grab;
      border-radius: 999px;
    }

    .product-nav-hit:active { cursor: grabbing; }

    .pulse {
      display: none;
    }

    .phone.show-hint .pulse { opacity: 1; }

    .pulse-nav {
      left: 34%;
      right: 34%;
      bottom: 2.55%;
      height: 2.2%;
      border-radius: 999px;
    }

    .pulse-orb {
      right: 5.8%;
      bottom: 3.5%;
      width: 13.8%;
      aspect-ratio: 1;
      border-radius: 50%;
    }

    @keyframes pulse {
      0% { transform: scale(.9); box-shadow: 0 0 0 0 rgba(112,242,239,.32); }
      65% { transform: scale(1); box-shadow: 0 0 0 16px rgba(112,242,239,0); }
      100% { transform: scale(.9); box-shadow: 0 0 0 0 rgba(112,242,239,0); }
    }

    .guide {
      align-self: center;
      min-width: 0;
    }

    /* Only rendered inside the mobile bottom sheet. */
    .sheet-handle { display: none; }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--cyan);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      max-width: 11em;
      font-size: clamp(30px, 4vw, 52px);
      line-height: 1.08;
      letter-spacing: -.04em;
    }

    .subtitle {
      margin: 14px 0 0;
      max-width: 32em;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.7;
    }

    .scene-switch {
      display: inline-flex;
      gap: 6px;
      margin-top: 18px;
      padding: 4px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(255,255,255,.035);
    }

    .scene-option {
      appearance: none;
      border: 0;
      border-radius: 10px;
      padding: 8px 14px;
      color: #939aa5;
      background: transparent;
      font-size: 13px;
      font-weight: 650;
      cursor: pointer;
      transition: color .2s ease, background .2s ease, box-shadow .2s ease;
    }

    .scene-option:hover { color: #fff; }

    .scene-option[aria-pressed="true"] {
      color: #fff;
      background: rgba(112,242,239,.14);
      box-shadow: inset 0 0 0 1px rgba(112,242,239,.28);
    }

    .state-card {
      margin-top: 16px;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--panel);
      backdrop-filter: blur(18px);
      box-shadow: inset 0 1px rgba(255,255,255,.05);
    }

    .state-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 14px;
    }

    .counter {
      color: var(--muted);
      font-size: 13px;
      font-variant-numeric: tabular-nums;
    }

    .state-name {
      font-size: 19px;
      font-weight: 700;
    }

    .instruction {
      min-height: 46px;
      margin: 0 0 16px;
      color: #dfe3e9;
      font-size: 14px;
      line-height: 1.65;
    }

    .steps {
      display: grid;
      gap: 8px;
    }

    .step {
      appearance: none;
      width: 100%;
      display: grid;
      grid-template-columns: 30px 1fr auto;
      align-items: center;
      gap: 10px;
      padding: 11px 12px;
      border: 1px solid transparent;
      border-radius: 13px;
      color: #b8bec7;
      background: rgba(255,255,255,.035);
      text-align: left;
      cursor: pointer;
      transition: .2s ease;
    }

    .step:hover { background: rgba(255,255,255,.07); color: #fff; }

    .step[aria-current="step"] {
      color: #fff;
      border-color: rgba(112,242,239,.3);
      background: linear-gradient(90deg, rgba(112,242,239,.13), rgba(255,45,111,.07));
    }

    .step-index {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: #8e95a0;
      background: rgba(255,255,255,.07);
      font-size: 12px;
      font-weight: 700;
    }

    .step[aria-current="step"] .step-index {
      color: #071313;
      background: var(--cyan);
    }

    .step-action { color: #727986; font-size: 12px; }

    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 14px;
    }

    .control {
      appearance: none;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 9px 14px;
      color: #e6e9ee;
      background: rgba(255,255,255,.05);
      cursor: pointer;
    }

    .control:hover { background: rgba(255,255,255,.1); }

    .kbd-hint { margin-left: auto; color: #727986; font-size: 12px; }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0;
    }

    /* ---------- Mobile: action panel becomes a bottom sheet instead of disappearing ---------- */
    @media (max-width: 780px) {
      html, body { height: 100%; }
      body { overflow: hidden; overscroll-behavior: none; background: #0d0f12; }
      .app {
        width: 100%;
        height: 100dvh;
        min-height: 0;
        padding: max(8px, env(safe-area-inset-top)) 0 0;
        grid-template-rows: auto minmax(0, 1fr);
        gap: 6px;
        background: #0d0f12;
      }
      .scheme-switch { transform: scale(.92); transform-origin: top center; }
      .demo-layout { display: block; height: 100%; min-height: 0; }
      .stage {
        width: 100%;
        height: 100%;
        padding-bottom: calc(var(--sheet-h, 214px) + 6px);
        transition: padding-bottom .3s cubic-bezier(.22,.8,.26,1);
      }
      .phone { width: auto; height: min(100%, 158.761vw); max-width: 100%; max-height: 100%; filter: none; }

      .guide {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 300;
        display: block;
        max-height: 80dvh;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        padding: 0 16px calc(64px + env(safe-area-inset-bottom));
        border-top: 1px solid rgba(255,255,255,.14);
        border-radius: 22px 22px 0 0;
        background: linear-gradient(180deg, rgba(23,26,32,.97), rgba(13,15,18,.99));
        -webkit-backdrop-filter: blur(24px);
        backdrop-filter: blur(24px);
        box-shadow: 0 -20px 48px rgba(0,0,0,.6);
        animation: sheet-in .34s cubic-bezier(.22,.8,.26,1) both;
      }

      @keyframes sheet-in {
        from { transform: translateY(18px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
      }

      .sheet-handle {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        width: 100%;
        padding: 11px 0 9px;
        margin: 0;
        border: 0;
        background: transparent;
        color: #98a0ac;
        font-size: 12px;
        font-weight: 650;
        letter-spacing: .02em;
        cursor: pointer;
      }

      .sheet-grip {
        width: 38px;
        height: 4px;
        border-radius: 999px;
        background: rgba(255,255,255,.26);
      }

      .sheet-label::after { content: "展开全部步骤"; }
      .guide.sheet-open .sheet-label::after { content: "收起面板"; }

      .guide .eyebrow { margin-bottom: 6px; font-size: 11px; }
      .guide h1 { max-width: none; font-size: 21px; line-height: 1.25; letter-spacing: -.02em; }
      .guide .subtitle { margin-top: 8px; font-size: 13px; line-height: 1.6; }
      .guide .scene-switch { margin-top: 12px; }
      .guide .state-card {
        margin-top: 12px;
        padding: 0;
        border: 0;
        border-radius: 0;
        background: transparent;
        box-shadow: none;
        backdrop-filter: none;
      }
      .guide .state-head { margin-bottom: 8px; gap: 10px; }
      .guide .state-name { font-size: 16px; }
      .guide .counter { font-size: 12px; }
      .guide .instruction {
        min-height: 0;
        margin: 0 0 10px;
        font-size: 13px;
        line-height: 1.55;
        color: #c9cfd8;
      }
      .guide .controls { margin-top: 10px; gap: 8px; }
      .guide .control { flex: 1; padding: 10px 12px; font-size: 13px; }
      .guide .kbd-hint { display: none; }

      /* Collapsed: compact chips, no long copy */
      .guide:not(.sheet-open) .eyebrow,
      .guide:not(.sheet-open) h1,
      .guide:not(.sheet-open) .subtitle,
      .guide:not(.sheet-open) .scene-switch { display: none; }
      .guide:not(.sheet-open) .state-card { margin-top: 0; }
      .guide:not(.sheet-open) .instruction {
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .guide:not(.sheet-open) .steps {
        display: flex;
        gap: 6px;
        overflow-x: auto;
        padding-bottom: 2px;
        scrollbar-width: none;
      }
      .guide:not(.sheet-open) .steps::-webkit-scrollbar { display: none; }
      .guide:not(.sheet-open) .step {
        flex: 0 0 auto;
        width: 36px;
        height: 34px;
        padding: 0;
        display: grid;
        grid-template-columns: 1fr;
        place-items: center;
      }
      .guide:not(.sheet-open) .step [data-label],
      .guide:not(.sheet-open) .step .step-action { display: none; }
      .guide:not(.sheet-open) .step-index { width: 26px; height: 26px; font-size: 12px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .frame, .step { transition: none; }
      .pulse { animation: none; }
    }
  
/* Approved floating prototype: only E / knowledge is replaced. */
.phone[data-scheme="e"][data-scene="knowledge"] > :not(#eKnowledgeFloating){visibility:hidden!important;pointer-events:none!important}
#eKnowledgeFloating{display:none;position:absolute;inset:0;width:100%;height:100%;border:0;background:transparent;z-index:100}
.phone[data-scheme="e"][data-scene="knowledge"] > #eKnowledgeFloating{display:block}

/* E/product uses the approved product floating demo; every other scene is untouched. */
.phone[data-scheme="e"][data-scene="product"] > :not(#eProductFloating){visibility:hidden!important;pointer-events:none!important}
#eProductFloating{display:none;position:absolute;inset:0;width:100%;height:100%;border:0;background:transparent;z-index:100;color-scheme:dark}
.phone[data-scheme="e"][data-scene="product"] > #eProductFloating{display:block}
</style>

  <script type="application/x-disabled">
    (() => {
      const clamp = (v, min = 0, max = 1) => Math.min(max, Math.max(min, v));
      const frames = [...document.querySelectorAll('.frame')];
      const phone = document.getElementById('phone');
      const navHit = document.getElementById('navHit');
      const orbHit = document.getElementById('orbHit');
      const suggestionHit = document.getElementById('suggestionHit');
      const resizeHit = document.getElementById('resizeHit');
      const edgeHit = document.getElementById('edgeHit');
      const stateName = document.getElementById('stateName');
      const instruction = document.getElementById('instruction');
      const counter = document.getElementById('counter');
      const live = document.getElementById('live');
      const stepButtons = [...document.querySelectorAll('.step')];

      const states = [
        ['沉浸浏览', '双击手机左侧的红色按钮，唤醒 AI 伴随模式。'],
        ['唤醒伴随', '点击右下角的圆形 AI，或点击“识别屏幕”，发起知识查询。'],
        ['询问AI', '按住浮窗左下角的 L 形区域并向左拖动，连续放大浮窗。'],
        ['放大浮窗', '按住右下角的圆形 AI 并向右滑动，将伴随功能收起到侧边。'],
        ['侧边收起', '点击屏幕右侧露出的半圆 AI，或向左拖动，即可恢复伴随模式。']
      ];

      let phase = 0;
      let resizeProgress = 0;
      let dockProgress = 0;
      let tracking = null;
      let startX = 0;
      let startProgress = 0;
      let lastTap = 0;
      let animationFrame = 0;

      function setOpacity(index, value) {
        frames[index].style.opacity = String(clamp(value));
      }

      function render() {
        frames.forEach(frame => frame.style.opacity = '0');
        frames[3].style.clipPath = `inset(6.75% 5.7% 13.3% ${68.2 - 29.6 * resizeProgress}% round 24px)`;

        if (phase === 0) setOpacity(0, 1);
        if (phase === 1) setOpacity(1, 1 - dockProgress);
        if (phase === 2 || phase === 3) {
          setOpacity(2, 1 - dockProgress);
          if (resizeProgress > 0.002) setOpacity(3, 1 - dockProgress);
        }
        if (phase === 4) setOpacity(4, 1);
        else if (dockProgress > 0) setOpacity(4, dockProgress);

        navHit.style.display = phase === 0 ? 'block' : 'none';
        orbHit.style.display = phase >= 1 && phase <= 3 ? 'block' : 'none';
        suggestionHit.style.display = phase === 1 ? 'block' : 'none';
        resizeHit.style.display = phase === 2 || phase === 3 ? 'block' : 'none';
        edgeHit.style.display = phase === 4 ? 'block' : 'none';
        resizeHit.style.left = `${64.8 - 29.6 * resizeProgress}%`;

        phone.classList.toggle('show-hint', !tracking);
        document.getElementById('navPulse').style.display = phase === 0 ? 'block' : 'none';
        document.getElementById('orbPulse').style.display = phase === 1 ? 'block' : 'none';

        stateName.textContent = states[phase][0];
        instruction.textContent = states[phase][1];
        counter.textContent = `${String(phase + 1).padStart(2, '0')} / 05`;
        stepButtons.forEach((button, index) => {
          if (index === phase) button.setAttribute('aria-current', 'step');
          else button.removeAttribute('aria-current');
        });
      }

      function announce() {
        live.textContent = `第 ${phase + 1} 步，${states[phase][0]}。${states[phase][1]}`;
      }

      function stopAnimation() {
        if (animationFrame) cancelAnimationFrame(animationFrame);
        animationFrame = 0;
      }

      function animateValue(from, to, duration, update, complete) {
        stopAnimation();
        const start = performance.now();
        const ease = t => 1 - Math.pow(1 - t, 3);
        const tick = now => {
          const raw = clamp((now - start) / duration);
          update(from + (to - from) * ease(raw));
          if (raw < 1) animationFrame = requestAnimationFrame(tick);
          else {
            animationFrame = 0;
            if (complete) complete();
          }
        };
        animationFrame = requestAnimationFrame(tick);
      }

      function jumpToStep(nextPhase, shouldAnnounce = true) {
        clearRecognitionTimer();
        stopAnimation();
        tracking = null;
        phone.classList.remove('tracking');
        phase = clamp(nextPhase, 0, 4);
        resizeProgress = phase === 3 ? 1 : 0;
        dockProgress = phase === 4 ? 1 : 0;
        render();
        if (shouldAnnounce) announce();
      }

      function openAssistant() {
        if (phase !== 1) return;
        phase = 2;
        resizeProgress = 0;
        dockProgress = 0;
        render();
        announce();
      }

      function beginTracking(type, event) {
        tracking = type;
        startX = event.clientX;
        startProgress = type === 'resize' ? resizeProgress : dockProgress;
        phone.classList.add('tracking');
        phone.classList.remove('show-hint');
        event.currentTarget.setPointerCapture(event.pointerId);
      }

      function finishResize() {
        const target = resizeProgress >= .42 ? 1 : 0;
        const from = resizeProgress;
        tracking = null;
        // 自动补全阶段继续关闭 CSS 二次过渡，完全由同一条 rAF 曲线驱动，避免拖拽释放后滞后或跳帧。
        phone.classList.add('tracking');
        animateValue(from, target, 240, value => {
          resizeProgress = value;
          render();
        }, () => {
          phase = target ? 3 : 2;
          resizeProgress = target;
          phone.classList.remove('tracking');
          render();
          announce();
        });
      }

      function finishDock() {
        const target = dockProgress >= .34 ? 1 : 0;
        const from = dockProgress;
        tracking = null;
        phone.classList.remove('tracking');
        animateValue(from, target, 230, value => {
          dockProgress = value;
          render();
        }, () => {
          if (target) {
            phase = 4;
            dockProgress = 1;
          } else {
            dockProgress = 0;
          }
          render();
          announce();
        });
      }

      function restoreFromEdge() {
        if (phase !== 4) return;
        phase = 1;
        dockProgress = 1;
        resizeProgress = 0;
        animateValue(1, 0, 260, value => {
          dockProgress = value;
          render();
        }, () => {
          dockProgress = 0;
          render();
          announce();
        });
      }

      navHit.addEventListener('pointerup', event => {
        const now = performance.now();
        if (now - lastTap < 380) {
          lastTap = 0;
          jumpToStep(1);
        } else {
          lastTap = now;
          navHit.animate([
            { transform: 'scaleX(.92)', opacity: .35 },
            { transform: 'scaleX(1)', opacity: 0 }
          ], { duration: 260, easing: 'ease-out' });
        }
        event.preventDefault();
      });

      navHit.addEventListener('dblclick', event => {
        if (!dWakeAnimating && phase === 0) jumpToStep(1);
        event.preventDefault();
      });

      suggestionHit.addEventListener('click', openAssistant);

      orbHit.addEventListener('pointerdown', event => beginTracking('dock', event));
      orbHit.addEventListener('pointermove', event => {
        if (tracking !== 'dock') return;
        const distance = event.clientX - startX;
        dockProgress = clamp(startProgress + distance / (phone.clientWidth * .13));
        render();
      });
      orbHit.addEventListener('pointerup', event => {
        if (tracking !== 'dock') return;
        const moved = Math.abs(event.clientX - startX);
        if (moved < 9) {
          tracking = null;
          phone.classList.remove('tracking');
          dockProgress = 0;
          if (phase === 1) openAssistant();
          else jumpToStep(1);
        } else finishDock();
      });
      orbHit.addEventListener('pointercancel', finishDock);

      resizeHit.addEventListener('pointerdown', event => beginTracking('resize', event));
      resizeHit.addEventListener('pointermove', event => {
        if (tracking !== 'resize') return;
        const distance = startX - event.clientX;
        resizeProgress = clamp(startProgress + distance / (phone.clientWidth * .29));
        phase = resizeProgress > .98 ? 3 : 2;
        render();
      });
      resizeHit.addEventListener('pointerup', event => {
        if (tracking === 'resize') finishResize();
      });
      resizeHit.addEventListener('pointercancel', finishResize);

      edgeHit.addEventListener('click', restoreFromEdge);
      edgeHit.addEventListener('pointerdown', event => {
        if (phase !== 4) return;
        tracking = 'restore';
        startX = event.clientX;
        startProgress = 1;
        phone.classList.add('tracking');
        edgeHit.setPointerCapture(event.pointerId);
      });
      edgeHit.addEventListener('pointermove', event => {
        if (tracking !== 'restore') return;
        const distance = startX - event.clientX;
        phase = 1;
        dockProgress = clamp(1 - distance / (phone.clientWidth * .13));
        render();
      });
      edgeHit.addEventListener('pointerup', () => {
        if (tracking !== 'restore') return;
        const target = dockProgress <= .66 ? 0 : 1;
        const from = dockProgress;
        tracking = null;
        phone.classList.remove('tracking');
        animateValue(from, target, 220, value => {
          dockProgress = value;
          render();
        }, () => {
          if (target === 1) phase = 4;
          else phase = 1;
          dockProgress = target;
          render();
          announce();
        });
      });

      stepButtons.forEach(button => button.addEventListener('click', () => jumpToStep(Number(button.dataset.step))));
      document.getElementById('restart').addEventListener('click', () => jumpToStep(0));
      document.getElementById('next').addEventListener('click', () => jumpToStep((phase + 1) % 5));

      window.addEventListener('keydown', event => {
        if (/^[1-5]$/.test(event.key)) jumpToStep(Number(event.key) - 1);
        else if (event.key === 'ArrowRight') jumpToStep(Math.min(4, phase + 1));
        else if (event.key === 'ArrowLeft') jumpToStep(Math.max(0, phase - 1));
        else if (event.key.toLowerCase() === 'r') jumpToStep(0);
      });

      phone.addEventListener('contextmenu', event => event.preventDefault());
      window.addEventListener('blur', () => {
        if (tracking === 'resize') finishResize();
        else if (tracking === 'dock') finishDock();
      });

      jumpToStep(0, false);
    })();
  </script>

          coverSource = motionFrames[sourcePhase].animate([

            { opacity: .18, offset: .24 },
            { opacity: .12 }
          ], { duration, easing: 'linear', fill: 'forwards' });
          mainMove = dMotionMain.animate([
            { opacity: 1, transform: 'scaleX(1)', filter: 'blur(0) brightness(1)' },
            { opacity: .92, transform: 'scaleX(.82)', filter: 'blur(2px) brightness(.99)', offset: .58 },
            { opacity: 0, transform: 'scaleX(.72164)', filter: 'blur(6px) brightness(.985)' }
          ], { duration, easing: ease, fill: 'forwards' });
          panelReveal = dMotionPanel.animate([
            { opacity: .12, clipPath: 'polygon(96.22% 1.2%, 96.22% 1.2%, 96.22% 96.3%, 96.22% 96.3%, 96.22% 88%, 96.22% 88%)', filter: 'blur(10px)' },
            { opacity: .42, clipPath: 'polygon(87% 1.2%, 96.22% 1.2%, 96.22% 96.3%, 68% 96.3%, 68% 88%, 87% 88%)', filter: 'blur(6px)', offset: .35 },
            { opacity: 1, clipPath: 'polygon(72.2% 1.2%, 96.22% 1.2%, 96.22% 96.3%, 4.35% 96.3%, 4.35% 88%, 72.2% 88%)', filter: 'blur(0)' }
          ], { duration, easing: ease, fill: 'forwards' });
        } else {
          // 3 → 4：保持快速收窄，但让第 4 步底图提前接管并持续交叉淡化，避免中间黑场。
          dMotionMask.style.display = 'none';
          if (!isProductMotion) dMotionMain.style.clipPath = 'none';
          coverSource = motionFrames[sourcePhase].animate([
            { opacity: 1 },
            { opacity: .56, offset: .3 },
            { opacity: .28, offset: .52 },
            { opacity: .08 }
          ], { duration, easing: 'linear', fill: 'forwards' });
          mainMove = dMotionMain.animate([
            { opacity: 1, transform: 'scaleX(.72164)', filter: 'blur(0) brightness(.985)', easing: ease },
            { opacity: .7, transform: 'scaleX(.48)', filter: 'blur(1.5px) brightness(.98)', offset: .3, easing: ease },
            { opacity: .18, transform: 'scaleX(.31)', filter: 'blur(3px) brightness(.975)', offset: .52, easing: ease },
            { opacity: 0, transform: 'scaleX(.25)', filter: 'blur(4px) brightness(.97)', offset: .66, easing: ease },
            { opacity: 0, transform: 'scaleX(.22479)', filter: 'blur(4px) brightness(.97)' }
          ], { duration, easing: 'linear', fill: 'forwards' });
          panelReveal = dMotionPanel.animate([
            { opacity: 0, clipPath: 'polygon(72.2% 1.2%, 96.22% 1.2%, 96.22% 96.3%, 4.35% 96.3%, 4.35% 88%, 72.2% 88%)', filter: 'blur(10px)', easing: ease },
            { opacity: .12, clipPath: 'polygon(56% 1.2%, 96.22% 1.2%, 96.22% 96.3%, 4.35% 96.3%, 4.35% 85%, 56% 85%)', filter: 'blur(6px)', offset: .38, easing: ease },
            { opacity: .55, clipPath: 'polygon(34% 1.2%, 96.22% 1.2%, 96.22% 96.3%, 4.35% 96.3%, 4.35% 81%, 34% 81%)', filter: 'blur(3px)', offset: .68, easing: ease },
            { opacity: 1, clipPath: 'polygon(25.1% 1.2%, 96.22% 1.2%, 96.22% 96.3%, 4.35% 96.3%, 4.35% 79%, 25.1% 79%)', filter: 'blur(0)' }
          ], { duration, easing: 'linear', fill: 'forwards' });
        }

        const softenSource = motionFrames[sourcePhase].animate([
          { filter: 'brightness(1)' },
          { filter: 'brightness(.985)' }
        ], { duration, fill: 'forwards' });

        const targetBaseReveal = targetFrame.animate(targetPhase === 3 ? [
          { opacity: 0, filter: 'blur(4px)', offset: 0 },
          { opacity: 0, filter: 'blur(4px)', offset: .28 },
          { opacity: .16, filter: 'blur(3px)', offset: .4 },
          { opacity: .6, filter: 'blur(1.5px)', offset: .68 },
          { opacity: 1, filter: 'blur(0)', offset: 1 }
        ] : [
          { opacity: 0, filter: 'blur(5px)', offset: 0 },
          { opacity: 0, filter: 'blur(5px)', offset: .44 },
          { opacity: .4, filter: 'blur(3px)', offset: .68 },
          { opacity: 1, filter: 'blur(0)', offset: 1 }
        ], { duration, easing: targetPhase === 3 ? 'linear' : ease, fill: 'forwards' });

        dKnowledgeAnimations = [coverSource, mainMove, panelReveal, softenSource, targetBaseReveal];
        Promise.all(dKnowledgeAnimations.map(animation => animation.finished)).then(() => {
          if (token !== dKnowledgeToken) return;
          const completedAnimations = [...dKnowledgeAnimations];
          dKnowledgeAnimating = false;
          phone.classList.remove('knowledge-animating');
          phase = targetPhase;
          resizeProgress = targetPhase === 3 ? 1 : 0;
          dockProgress = 0;
          // 与目标整帧无过渡交接，避免动画完成后再次闪烁。
          phone.classList.add('tracking');
          render();
          void targetFrame.offsetWidth;
          completedAnimations.forEach(animation => animation.cancel());
          dKnowledgeAnimations = [];
          resetDKnowledgeLayers();
          requestAnimationFrame(() => phone.classList.remove('tracking'));
          announce();
        }).catch(() => {});
      }

      function renderGuide() {
        const config = getConfig();
        const state = config.states[phase];
        conceptName.textContent = config.concept;
        schemeTitle.textContent = config.title;
        schemeSubtitle.textContent = config.subtitle;
        stateName.textContent = state[0];
        instruction.textContent = state[1];
        counter.textContent = `${String(phase + 1).padStart(2, '0')} / 05`;

        schemeButtons.forEach(button => {
          button.setAttribute('aria-pressed', String(button.dataset.scheme === scheme));
        });

        sceneButtons.forEach(button => {
          button.setAttribute('aria-pressed', String(button.dataset.scene === scene));
        });

        stepButtons.forEach((button, index) => {
          button.querySelector('[data-label]').textContent = config.labels[index];
          button.querySelector('[data-action]').textContent = config.actions[index];
          if (index === phase) button.setAttribute('aria-current', 'step');
          else button.removeAttribute('aria-current');
        });
      }

      function render() {
        const isProduct = scene === 'product';
        allFrames.forEach(frame => {
          frame.style.opacity = '0';
          frame.style.transform = '';
          frame.style.filter = '';
          if (frame.classList.contains('d-frame') || frame.classList.contains('d-product-frame') || frame.classList.contains('product-frame')) frame.style.clipPath = '';
        });

        if (dWakeAnimating && scheme === 'd' && !isProduct) {
          setOpacity(dFrames, 0, 1);
          dWakeUnderlay.style.display = 'block';
          dWakeStart.style.display = 'block';
          dWakeSettled.style.display = 'block';
          dWakeTools.style.display = 'block';
        } else if (isProduct) {
          setOpacity(scheme === 'd' ? dProductFrames : productFrames, phase, 1);
        } else if (scheme === 'e') {
          eFrames[3].style.clipPath = `inset(6.75% 5.7% 13.3% ${68.2 - 29.6 * resizeProgress}% round 24px)`;
          if (phase === 0) setOpacity(eFrames, 0, 1);
          if (phase === 1) setOpacity(eFrames, 1, 1 - dockProgress);
          if (phase === 2 || phase === 3) {
            setOpacity(eFrames, 2, 1 - dockProgress);
            if (resizeProgress > 0.002) setOpacity(eFrames, 3, 1 - dockProgress);
          }
          if (phase === 4) setOpacity(eFrames, 4, 1);
          else if (dockProgress > 0) setOpacity(eFrames, 4, dockProgress);
        } else {
          if (phase === 0) setOpacity(dFrames, 0, 1);
          if (phase === 1) setOpacity(dFrames, 1, 1 - dockProgress);
          if (phase === 2) {
            // 003 → 004：保持 003 为底图，从右向左连续揭示 004。
            // 这样主页面的右边界会跟随拖拽移动，而不是在两张状态图之间跳变。
            setOpacity(dFrames, 2, 1);
            setOpacity(dFrames, 3, 1);
            dFrames[3].style.clipPath = `inset(0 0 0 ${(1 - resizeProgress) * 100}%)`;
          }
          if (phase === 3) {
            // 004 → 005：以 004 为底图，从左向右揭示 005，形成主页面重新展开的连续推移。
            setOpacity(dFrames, 3, 1);
            setOpacity(dFrames, 4, 1);
            dFrames[4].style.clipPath = `inset(0 ${(1 - dockProgress) * 100}% 0 0)`;
          }
          if (phase === 4) setOpacity(dFrames, 4, 1);
        }

        navHit.style.display = phase === 0 && !dWakeAnimating && !dKnowledgeAnimating ? 'block' : 'none';
        navHit.setAttribute('aria-label', scheme === 'd' && !isProduct
          ? '点击手机左侧红色按钮唤醒AI伴随模式'
          : '双击手机左侧红色按钮唤醒AI伴随模式');
        orbHit.style.display = isProduct
          ? (phase === 1 && !dKnowledgeAnimating ? 'block' : 'none')
          : scheme === 'd'
          ? (phase === 1 && !dKnowledgeAnimating ? 'block' : 'none')
          : (phase >= 1 && phase <= 3 ? 'block' : 'none');
        suggestionHit.style.display = isProduct
          ? ((phase === 1 || phase === 2) && !dWakeAnimating && !dKnowledgeAnimating ? 'block' : 'none')
          : scheme === 'd'
          ? (phase === 1 && !dKnowledgeAnimating ? 'block' : 'none')
          : (phase === 1 || phase === 2 ? 'block' : 'none');
        resizeHit.style.display = scheme === 'e' && !isProduct && phase === 3 ? 'block' : 'none';
        bottomZone.style.display = scheme === 'd' && !isProduct && !dKnowledgeAnimating && (phase === 2 || phase === 3) ? 'block' : 'none';
        edgeHit.style.display = scheme === 'e' && !isProduct && phase === 4 ? 'block' : 'none';
        platformHit.style.display = 'none';
        productNavHit.style.display = isProduct && phase === 3 ? 'block' : 'none';
        if (isProduct && scheme === 'd') {
          productNavHit.style.left = '31%';
          productNavHit.style.right = '31%';
          productNavHit.style.bottom = '.3%';
          productNavHit.style.width = 'auto';
          productNavHit.style.height = '5.4%';
        } else if (!isProduct && phase === 2) {
          orbHit.style.left = 'auto';
          orbHit.style.right = '3.9%';
          orbHit.style.bottom = '2%';
          orbHit.style.width = '17.5%';
          suggestionHit.style.left = 'auto';
          suggestionHit.style.right = '7.2%';
          suggestionHit.style.bottom = '20.3%';
          suggestionHit.style.width = '26%';
          suggestionHit.style.height = '7.6%';
        } else {
          productNavHit.style.left = '30%';
          productNavHit.style.right = '30%';
          productNavHit.style.bottom = '.4%';
          productNavHit.style.width = 'auto';
          productNavHit.style.height = '6%';
        }
        resizeHit.style.left = `${64.8 - 29.6 * resizeProgress}%`;
        if (scheme === 'd' && !isProduct && phase === 2) {
          bottomZone.style.left = '72%';
          bottomZone.style.right = '3%';
          bottomZone.style.top = '36%';
          bottomZone.style.bottom = 'auto';
          bottomZone.style.width = '25%';
          bottomZone.style.height = '10%';
          bottomZone.style.cursor = 'pointer';
          bottomZone.setAttribute('aria-label', '打开建议：蓝调时刻是什么');
        } else if (scheme === 'd' && !isProduct && phase === 3) {
          bottomZone.style.left = '11.5%';
          bottomZone.style.right = 'auto';
          bottomZone.style.top = 'auto';
          bottomZone.style.bottom = '10.5%';
          bottomZone.style.width = '15%';
          bottomZone.style.height = '10%';
          bottomZone.style.cursor = 'se-resize';
          bottomZone.setAttribute('aria-label', '拖动左侧主屏幕右下角的弧形把手恢复伴随浏览');
        }

        suggestionHit.style.top = 'auto';
        if (scheme === 'd' && isProduct && phase === 2) {
          suggestionHit.style.left = 'auto';
          suggestionHit.style.right = '5.8%';
          suggestionHit.style.top = '28.2%';
          suggestionHit.style.bottom = 'auto';
          suggestionHit.style.width = '21.4%';
          suggestionHit.style.height = '19.4%';
        } else if (scheme === 'e' && isProduct && phase === 2) {
          suggestionHit.style.left = 'auto';
          suggestionHit.style.right = '7.7%';
          suggestionHit.style.top = '51.8%';
          suggestionHit.style.bottom = 'auto';
          suggestionHit.style.width = '21.5%';
          suggestionHit.style.height = '19.5%';
        } else if (scheme === 'd') {
          orbHit.style.left = '6.5%';
          orbHit.style.right = 'auto';
          orbHit.style.bottom = '2.5%';
          orbHit.style.width = '17.5%';
          suggestionHit.style.left = '20%';
          suggestionHit.style.right = '4.2%';
          suggestionHit.style.bottom = '3.2%';
          suggestionHit.style.width = 'auto';
          suggestionHit.style.height = '5.7%';
        } else {
          orbHit.style.left = 'auto';
          orbHit.style.right = '3.9%';
          orbHit.style.bottom = '2%';
          orbHit.style.width = '17.5%';
          suggestionHit.style.left = 'auto';
          suggestionHit.style.right = phase === 2 ? '7.8%' : '7.2%';
          suggestionHit.style.bottom = phase === 2 ? '20.3%' : '12.3%';
          suggestionHit.style.width = phase === 2 ? '22.8%' : '26%';
          suggestionHit.style.height = phase === 2 ? '7.6%' : '5.8%';
        }
        orbHit.style.cursor = scheme === 'e' && !isProduct ? 'grab' : 'pointer';
        suggestionHit.setAttribute('aria-label', isProduct
          ? (phase === 2 ? '打开产品信息建议' : '识别屏幕中的商品')
          : scheme === 'e' && phase === 2
          ? '打开建议：蓝调时刻是什么'
          : '识别屏幕并发起知识查询');
        phone.dataset.scheme = scheme;
        phone.dataset.scene = scene;
        polished.sync();
        renderGuide();
        eFloating.sync();
        eProductFloating.sync();
      }

      function announce() {
        const config = getConfig();
        const state = config.states[phase];
        live.textContent = `${config.concept}，第 ${phase + 1} 步，${state[0]}。${state[1]}`;
      }

      function stopAnimation() {
        if (animationFrame) cancelAnimationFrame(animationFrame);
        animationFrame = 0;
      }

      function animateValue(from, to, duration, update, complete) {
        stopAnimation();
        const startedAt = performance.now();
        const ease = t => 1 - Math.pow(1 - t, 3);
        const tick = now => {
          const raw = clamp((now - startedAt) / duration);
          update(from + (to - from) * ease(raw));
          if (raw < 1) animationFrame = requestAnimationFrame(tick);
          else {
            animationFrame = 0;
            if (complete) complete();
          }
        };
        animationFrame = requestAnimationFrame(tick);
      }

      function jumpToStep(nextPhase, shouldAnnounce = true) {
        const targetPhase = clamp(nextPhase, 0, 4);
        if (!dWakeAnimating && shouldAnnounce && scheme === 'd' && phase === 0 && targetPhase === 1) {
          playDWakeAnimation();
          return;
        }
        if (!dKnowledgeAnimating && shouldAnnounce && scheme === 'd' && phase === 1 && targetPhase === 2) {
          playDKnowledgeTransition(2);
          return;
        }
        if (!dKnowledgeAnimating && shouldAnnounce && scheme === 'd' && phase === 2 && targetPhase === 3) {
          playDKnowledgeTransition(3);
          return;
        }
        cancelDWakeAnimation();
        polished.cancel();
        cancelDKnowledgeAnimation();
        stopAnimation();
        tracking = null;
        // 直接跳转（尤其是“重新演示”）必须无过渡复位，避免上一状态淡出形成重影。
        phone.classList.add('tracking');
        phase = targetPhase;
        resizeProgress = phase === 3 ? 1 : 0;
        dockProgress = phase === 4 ? 1 : 0;
        platformSwipeReady = false;
        render();
        void dFrames[targetPhase].offsetWidth;
        requestAnimationFrame(() => phone.classList.remove('tracking'));
        if (shouldAnnounce) announce();
      }

      function setScheme(nextScheme) {
        if (!schemes[nextScheme]) return;
        scheme = nextScheme;
        jumpToStep(0);
      }

      function setScene(nextScene) {
        if (nextScene !== 'knowledge' && nextScene !== 'product') return;
        scene = nextScene;
        jumpToStep(0);
      }

      function openAssistant() {
        if (phase !== 1) return;
        if (scheme === 'd') {
          playDKnowledgeTransition(2);
          return;
        }
        phase = 2;
        resizeProgress = 0;
        dockProgress = 0;
        platformSwipeReady = false;
        render();
        announce();
      }

      function beginTracking(type, event, progress = 0) {
        tracking = type;
        startX = event.clientX;
        startY = event.clientY;
        startProgress = progress;
        phone.classList.add('tracking');
        event.currentTarget.setPointerCapture(event.pointerId);
      }

      function finishResize() {
        const target = resizeProgress >= .42 ? 1 : 0;
        const from = resizeProgress;
        tracking = null;
        phone.classList.add('tracking');
        animateValue(from, target, 240, value => {
          resizeProgress = value;
          render();
        }, () => {
          phase = target ? 3 : 2;
          resizeProgress = target;
          phone.classList.remove('tracking');
          render();
          announce();
        });
      }

      function finishDock(fallbackPhase = phase) {
        const target = dockProgress >= .34 ? 1 : 0;
        const from = dockProgress;
        tracking = null;
        phone.classList.add('tracking');
        animateValue(from, target, 230, value => {
          dockProgress = value;
          render();
        }, () => {
          phase = target ? 4 : fallbackPhase;
          dockProgress = target;
          if (target) resizeProgress = 0;
          phone.classList.remove('tracking');
          render();
          announce();
        });
      }

      function finishPlatformSwipe() {
        const shouldSwitch = platformSwipeReady;
        tracking = null;
        platformSwipeReady = false;
        if (shouldSwitch) {
          phase = 4;
          resizeProgress = 0;
          dockProgress = 1;
          render();
          announce();
        }
        phone.classList.remove('tracking');
      }

      function restoreFromEdge() {
        if (phase !== 4) return;
        phase = 1;
        dockProgress = 1;
        resizeProgress = 0;
        animateValue(1, 0, 260, value => {
          dockProgress = value;
          render();
        }, () => {
          dockProgress = 0;
          render();
          announce();
        });
      }

      navHit.addEventListener('pointerup', event => {
        if (scheme === 'd' && scene === 'knowledge' && phase === 0) {
          lastTap = 0;
          jumpToStep(1);
          event.preventDefault();
          return;
        }
        const now = performance.now();
        if (now - lastTap < 380) {
          lastTap = 0;
          jumpToStep(1);
        } else {
          lastTap = now;
          navHit.animate([
            { transform: 'scaleX(.92)', opacity: .28 },
            { transform: 'scaleX(1)', opacity: 0 }
          ], { duration: 240, easing: 'ease-out' });
        }
        event.preventDefault();
      });

      navHit.addEventListener('dblclick', event => {
        // 第二次 pointerup 已经启动商品场景的唤醒动画；忽略随后产生的 dblclick，
        // 避免同一次双击取消动画并直接跳到第 2 步底图。
        if (!dWakeAnimating && !dKnowledgeAnimating && phase === 0) jumpToStep(1);
        event.preventDefault();
      });

      suggestionHit.addEventListener('click', () => {
        if (scene === 'product' && phase === 2) {
          jumpToStep(3);
          return;
        }
        if (scheme === 'e' && scene === 'knowledge' && phase === 2) {
          jumpToStep(3);
          return;
        }
        openAssistant();
      });
      platformHit.addEventListener('click', () => {
        if (scene === 'product' && phase === 3) jumpToStep(4);
      });

      productNavHit.addEventListener('pointerdown', event => {
        if (scene === 'product' && phase === 3) {
          platformSwipeReady = false;
          beginTracking('platform-swipe', event, 0);
        }
      });
      productNavHit.addEventListener('pointermove', event => {
        if (tracking !== 'platform-swipe') return;
        const leftDistance = Math.max(0, startX - event.clientX);
        const upwardDistance = Math.max(0, startY - event.clientY);
        platformSwipeReady = leftDistance >= 12 || upwardDistance >= 12;
      });
      productNavHit.addEventListener('pointerup', () => {
        if (tracking === 'platform-swipe') finishPlatformSwipe();
      });
      productNavHit.addEventListener('pointercancel', () => {
        if (tracking === 'platform-swipe') finishPlatformSwipe();
      });

      orbHit.addEventListener('pointerdown', event => {
        if (scheme === 'e' && scene === 'knowledge') beginTracking('dock', event, dockProgress);
        else beginTracking('orb-tap', event, 0);
      });

      orbHit.addEventListener('pointermove', event => {
        if (tracking !== 'dock') return;
        dockProgress = clamp(startProgress + (event.clientX - startX) / (phone.clientWidth * .13));
        render();
      });

      orbHit.addEventListener('pointerup', event => {
        const moved = Math.abs(event.clientX - startX);
        if (tracking === 'orb-tap') {
          tracking = null;
          phone.classList.remove('tracking');
          if (moved < 9) openAssistant();
          return;
        }
        if (tracking !== 'dock') return;
        if (moved < 9) {
          tracking = null;
          phone.classList.remove('tracking');
          dockProgress = 0;
          if (phase === 1) openAssistant();
          else jumpToStep(1);
        } else finishDock(phase);
      });

      orbHit.addEventListener('pointercancel', () => {
        if (tracking === 'dock') finishDock(phase);
        else {
          tracking = null;
          phone.classList.remove('tracking');
        }
      });

      resizeHit.addEventListener('pointerdown', event => {
        if (scheme === 'e') beginTracking('resize', event, resizeProgress);
      });

      resizeHit.addEventListener('pointermove', event => {
        if (tracking !== 'resize') return;
        resizeProgress = clamp(startProgress + (startX - event.clientX) / (phone.clientWidth * .29));
        phase = resizeProgress > .98 ? 3 : 2;
        render();
      });

      resizeHit.addEventListener('pointerup', () => {
        if (tracking === 'resize') finishResize();
      });
      resizeHit.addEventListener('pointercancel', () => {
        if (tracking === 'resize') finishResize();
      });

      bottomZone.addEventListener('pointerdown', event => {
        if (scheme !== 'd' || scene !== 'knowledge') return;
        if (phase === 3) beginTracking('d-return', event, dockProgress);
      });

      bottomZone.addEventListener('pointermove', event => {
        if (tracking === 'd-return') {
          const rightDistance = Math.max(0, event.clientX - startX);
          const downwardDistance = Math.max(0, event.clientY - startY);
          dockProgress = clamp(startProgress + Math.max(rightDistance, downwardDistance) / (phone.clientWidth * .34));
          render();
        }
      });

      bottomZone.addEventListener('pointerup', () => {
        if (tracking === 'd-return') finishDock(3);
      });

      bottomZone.addEventListener('pointercancel', () => {
        if (tracking === 'd-return') finishDock(3);
      });

      bottomZone.addEventListener('click', () => {
        if (scheme === 'd' && scene === 'knowledge' && phase === 2) playDKnowledgeTransition(3);
      });

      edgeHit.addEventListener('click', restoreFromEdge);
      edgeHit.addEventListener('pointerdown', event => {
        if (phase !== 4) return;
        beginTracking('restore', event, 1);
      });
      edgeHit.addEventListener('pointermove', event => {
        if (tracking !== 'restore') return;
        phase = 1;
        dockProgress = clamp(1 - (startX - event.clientX) / (phone.clientWidth * .13));
        render();
      });
      edgeHit.addEventListener('pointerup', () => {
        if (tracking !== 'restore') return;
        const target = dockProgress <= .66 ? 0 : 1;
        const from = dockProgress;
        tracking = null;
        phone.classList.remove('tracking');
        animateValue(from, target, 220, value => {
          dockProgress = value;
          render();
        }, () => {
          phase = target === 1 ? 4 : 1;
          dockProgress = target;
          render();
          announce();
        });
      });

      schemeButtons.forEach(button => {
        button.addEventListener('click', () => setScheme(button.dataset.scheme));
      });
      sceneButtons.forEach(button => {
        button.addEventListener('click', () => setScene(button.dataset.scene));
      });
      stepButtons.forEach(button => {
        button.addEventListener('click', () => jumpToStep(Number(button.dataset.step)));
      });
      document.getElementById('restart').addEventListener('click', () => jumpToStep(0));
      document.getElementById('next').addEventListener('click', () => jumpToStep((phase + 1) % 5));

      window.addEventListener('keydown', event => {
        if (/^[1-5]$/.test(event.key)) jumpToStep(Number(event.key) - 1);
        else if (event.key === 'ArrowRight') jumpToStep(Math.min(4, phase + 1));
        else if (event.key === 'ArrowLeft') jumpToStep(Math.max(0, phase - 1));
        else if (event.key.toLowerCase() === 'r') jumpToStep(0);
        else if (event.key.toLowerCase() === 'd') setScheme('d');
        else if (event.key.toLowerCase() === 'e') setScheme('e');
        else if (event.key.toLowerCase() === 'k') setScene('knowledge');
        else if (event.key.toLowerCase() === 'p') setScene('product');
      });

      phone.addEventListener('contextmenu', event => event.preventDefault());
      window.addEventListener('blur', () => {
        if (tracking === 'resize') finishResize();
        else if (tracking === 'dock' || tracking === 'd-return') finishDock(phase);
        else if (tracking === 'platform-swipe') finishPlatformSwipe();
      });

      /* E 的两个子页在 display:none 状态下加载时量不到尺寸，可见后必须主动推一次 resize。
         iOS Safari 不会像 Chrome 那样自动补发 resize，所以这里显式通知。 */
      function nudgeFrameSize(frame) {
        const ping = () => {
          try {
            frame.contentWindow?.postMessage({ type: 'e-resize' }, '*');
            frame.contentWindow?.dispatchEvent(new Event('resize'));
          } catch (error) { /* 跨域时忽略 */ }
        };
        /* 子页如果始终量不到自己的尺寸（Safari 下 iframe 刚显示时常见），
           父页直接按 iframe 的实际盒子把缩放变量写进去，兜底保证画布不会按 1:1 铺开。 */
        const forceFit = () => {
          try {
            const doc = frame.contentDocument;
            if (!doc) return;
            const inline = doc.documentElement.style;
            if (parseFloat(inline.getPropertyValue('--w')) > 0) return;
            const box = frame.getBoundingClientRect();
            const height = Math.min(box.height, box.width * 1640 / 1033);
            if (!height) return;
            inline.setProperty('--scale', height / 1640);
            inline.setProperty('--w', height * 1033 / 1640 + 'px');
            inline.setProperty('--h', height + 'px');
          } catch (error) { /* 跨域时忽略 */ }
        };
        requestAnimationFrame(ping);
        setTimeout(ping, 120);
        setTimeout(() => { ping(); forceFit(); }, 460);
        setTimeout(() => { ping(); forceFit(); }, 1200);
      }

      const eFloating = (() => {
        const frame = document.getElementById('eKnowledgeFloating');
        const enabled = () => scheme === 'e' && scene === 'knowledge';
        let lastPhase = null, wasEnabled = false;
        function sync(force = false) {
          const active = enabled();
          const target = active ? phase : 0;
          if (force || target !== lastPhase || active !== wasEnabled) {
            frame.contentWindow?.postMessage({type:'e-floating-go', phase:target}, '*');
            lastPhase = target;
          }
          if (active && !wasEnabled) nudgeFrameSize(frame);
          wasEnabled = active;
        }
        frame.addEventListener('load', () => sync(true));
        window.addEventListener('message', event => {
          if (event.source !== frame.contentWindow || !enabled()) return;
          if (event.data?.type === 'e-floating-state') {
            const value = event.data.phase;
            if (!Number.isInteger(value) || value < 0 || value > 4) return;
            phase = value;
            lastPhase = value;
            resizeProgress = value === 3 ? 1 : 0;
            dockProgress = value === 4 ? 1 : 0;
            renderGuide();
            announce();
          } else if (event.data?.type === 'e-floating-key' && /^[1-5dDekKpPrR]$/.test(event.data.key)) {
            window.dispatchEvent(new KeyboardEvent('keydown', {key:event.data.key}));
          }
        });
        return {sync};
      })();

      const eProductFloating = (() => {
        const frame = document.getElementById('eProductFloating');
        const enabled = () => scheme === 'e' && scene === 'product';
        let lastHost = null, wasEnabled = false, childPhase = 0;
        function request(target) {
          childPhase = target;
          lastHost = Math.min(4, target);
          frame.contentWindow?.postMessage({type:'e-product-go', phase:target}, '*');
        }
        function sync(force = false) {
          const active = enabled();
          if (force || active !== wasEnabled || (active && phase !== lastHost)) request(active ? phase : 0);
          if (active && !wasEnabled) nudgeFrameSize(frame);
          wasEnabled = active;
        }
        frame.addEventListener('load', () => sync(true));
        window.addEventListener('message', event => {
          if (event.source !== frame.contentWindow || !enabled()) return;
          if (event.data?.type === 'e-product-state') {
            const value = event.data.phase;
            if (!Number.isInteger(value) || value < 0 || value > 5) return;
            childPhase = value;
            // Keep the existing five right-hand labels verbatim. Both marketplace
            // states, expanded and edge-docked, remain under cross-platform companion.
            phase = Math.min(4, value);
            lastHost = phase;
            renderGuide();
            announce();
          } else if (event.data?.type === 'e-product-key' && /^[dDkKpPrR]$/.test(event.data.key)) {
            if (event.data.key.toLowerCase() === 'r') request(0);
            else window.dispatchEvent(new KeyboardEvent('keydown', {key:event.data.key}));
          }
        });
        const intercept = (node, action) => node.addEventListener('click', event => {
          if (!enabled()) return;
          event.preventDefault(); event.stopImmediatePropagation(); action();
        }, true);
        stepButtons.forEach(button => intercept(button, () => request(Number(button.dataset.step))));
        intercept(document.getElementById('restart'), () => request(0));
        intercept(document.getElementById('next'), () => request((childPhase + 1) % 6));
        window.addEventListener('keydown', event => {
          if (!enabled()) return;
          let target = null;
          if (/^[1-6]$/.test(event.key)) target = Number(event.key) - 1;
          else if (event.key === 'ArrowRight') target = Math.min(5, childPhase + 1);
          else if (event.key === 'ArrowLeft') target = Math.max(0, childPhase - 1);
          else if (event.key === 'Escape' || event.key.toLowerCase() === 'r') target = 0;
          if (target !== null) {
            event.preventDefault(); event.stopImmediatePropagation(); request(target);
          }
        }, true);
        return {sync};
      })();

      jumpToStep(0, false);
    })();
  </script>

  <script>
    /* Mobile action panel: keep the step list / controls reachable as a bottom sheet. */
    (() => {
      const guide = document.querySelector('.guide');
      const toggle = document.getElementById('sheetToggle');
      if (!guide || !toggle) return;

      const root = document.documentElement;
      const mq = window.matchMedia('(max-width: 780px)');
      const isOpen = () => guide.classList.contains('sheet-open');

      function syncHeight() {
        if (!mq.matches) { root.style.removeProperty('--sheet-h'); return; }
        if (isOpen()) return;
        root.style.setProperty('--sheet-h', Math.ceil(guide.getBoundingClientRect().height) + 'px');
      }

      function setOpen(open) {
        guide.classList.toggle('sheet-open', open);
        toggle.setAttribute('aria-expanded', String(open));
        if (open) guide.scrollTop = 0;
        else requestAnimationFrame(syncHeight);
      }

      toggle.addEventListener('click', () => setOpen(!isOpen()));

      guide.addEventListener('click', event => {
        if (event.target.closest('#sheetToggle')) return;
        if (mq.matches && event.target.closest('.step, .control')) {
          setTimeout(() => setOpen(false), 80);
        }
      }, true);

      /* Tap anywhere outside the panel to fold it back down. */
      document.addEventListener('pointerdown', event => {
        if (!mq.matches || !isOpen() || guide.contains(event.target)) return;
        setOpen(false);
      }, true);

      mq.addEventListener('change', () => { setOpen(false); syncHeight(); });
      window.addEventListener('resize', syncHeight);
      window.addEventListener('orientationchange', () => setTimeout(syncHeight, 220));
      window.addEventListener('load', syncHeight);
      requestAnimationFrame(syncHeight);
      document.fonts?.ready.then(syncHeight);

      /* Step copy changes height slightly (1 vs 2 lines) — keep the phone clear of the sheet. */
      if ('ResizeObserver' in window) {
        new ResizeObserver(syncHeight).observe(guide);
      }
    })();
  </script>
</body>
</html>
